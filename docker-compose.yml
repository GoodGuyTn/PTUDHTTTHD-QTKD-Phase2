# PostgreSQL 16 + Adminer (giao diện web xem dữ liệu) cho môi trường phát triển.
# Mật khẩu KHÔNG ghi ở đây: docker compose tự đọc file .env cùng thư mục (file .env bị .gitignore).
# Tạo .env bằng cách copy .env.example rồi đổi mật khẩu.
services:
  postgres:
    image: postgres:16-alpine
    container_name: qtkd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qtkd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Hay tao file .env tu .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-qtkd}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # 5433 để không đụng Postgres khác đang dùng 5432
    volumes:
      - qtkd-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:6.3.1
    container_name: qtkd-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"   # http://localhost:8081  (System: PostgreSQL, Server: postgres)
    depends_on:
      postgres:
        condition: service_healthy   # chờ Postgres sẵn sàng (healthcheck ở trên)

volumes:
  qtkd-pgdata:
